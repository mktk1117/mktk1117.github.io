<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expedition · Takahiro Miki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@500..900&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;600&family=Manrope:wght@400..800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Unbounded:wght@400..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Work+Sans:wght@400;600&family=Sora:wght@400..800&family=Inter:wght@400;600&family=Inter+Tight:wght@400..800&family=Geist:wght@400..900&family=Geist+Mono:wght@400;500&family=Space+Grotesk:wght@400..700&family=Space+Mono:wght@400;700&family=DM+Serif+Display&family=DM+Sans:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap">
<style>
  /* Single, deliberately dark "field footage" world — painted explicitly, no theme switching. */
  :root{
    color-scheme: dark;
    --ground:#0d1014;
    --ground-2:#151a20;
    --paper:#f1efe9;
    --ink:#eceef0;
    --ink-2:#aab2ba;
    --mute:#6f7a84;
    --line:#26303a;
    --tag:#8fd6e3;
    --gold:#faba39;
    --hmap:linear-gradient(90deg,#30123b,#4662d7,#36aaf9,#1ae4b6,#72fe5e,#c8ef34,#faba39,#f66b19,#ca2a04);
    --display:"Archivo", "Arial Narrow", Arial, sans-serif;
    --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --gutter:clamp(16px, 4vw, 48px);
    --g-rgb:13,16,20;
    --i-rgb:236,238,240;
    --on-media:#f4f5f6;
  }
  html{background:var(--ground)}
  body{background:var(--ground);color:var(--ink);font:400 17px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:clip}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--tag);outline-offset:3px;border-radius:2px}
  .mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  video,canvas,img{display:block}

  /* ---------- nav ---------- */
  .nav{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:calc(14px + env(safe-area-inset-top,0px)) var(--gutter) 14px;
    background:linear-gradient(180deg,rgba(var(--g-rgb),.8),rgba(var(--g-rgb),0));}
  .nav .name{font:700 15px/1 var(--display);font-stretch:112%;letter-spacing:.01em;text-decoration:none}
  .nav ul{display:flex;gap:clamp(12px,2.4vw,28px);list-style:none;margin:0;padding:0}
  .nav ul a{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ink-2)}
  .nav ul a:hover{color:var(--ink)}
  .menu-btn{display:none;appearance:none;background:none;border:1px solid rgba(var(--i-rgb),.3);color:var(--ink);border-radius:999px;padding:8px 12px;cursor:pointer}
  @media (max-width:720px){
    .menu-btn{display:inline-flex}
    .nav ul{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;padding:8px var(--gutter) 16px;background:rgba(var(--g-rgb),.97);border-bottom:1px solid var(--line)}
    .nav.open ul{display:flex}
    .nav ul a{display:block;padding:12px 0;font-size:13px}
  }

  /* ---------- hero ---------- */
  .hero{position:relative;height:min(94svh,980px);min-height:560px;overflow:hidden;isolation:isolate}
  .hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
  .hero::after{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(180deg,rgba(var(--g-rgb),.1) 40%,rgba(var(--g-rgb),.55) 70%,var(--ground) 100%),
               linear-gradient(90deg,rgba(var(--g-rgb),.55),rgba(var(--g-rgb),0) 60%)}
  .hero-copy{position:absolute;left:var(--gutter);right:var(--gutter);bottom:clamp(40px,8vh,88px);max-width:980px}
  .eyebrow{color:var(--tag);margin-bottom:18px}
  .hero h1{margin:0;font:800 clamp(52px,11vw,168px)/.86 var(--display);font-stretch:118%;letter-spacing:-.02em}
  .hero p.lede{margin:22px 0 0;max-width:34ch;font-size:clamp(19px,2vw,24px);line-height:1.35;text-wrap:balance}
  .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border:1px solid rgba(var(--i-rgb),.28);border-radius:999px;
    font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;background:rgba(var(--g-rgb),.35);backdrop-filter:blur(6px)}
  .btn:hover{border-color:var(--ink);background:rgba(var(--i-rgb),.08)}
  .btn.solid{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .telemetry{position:absolute;right:var(--gutter);bottom:clamp(40px,8vh,88px);text-align:right;color:var(--ink-2);line-height:1.9}
  .telemetry b{color:var(--ink);font-weight:500}
  .rec{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f66b19;margin-right:8px;vertical-align:1px;animation:blink 1.6s steps(2) infinite}
  @keyframes blink{50%{opacity:.15}}
  @media (max-width:760px){.telemetry{display:none}}

  /* ---------- papers: sticky chapters + scroll-scrubbed media ---------- */
  .papers{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);column-gap:clamp(24px,4vw,64px);padding-inline:var(--gutter);padding-block:110px 40px}
  .papers-head{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px 40px;margin-bottom:40px}
  .papers-head h2{margin:0;font:800 clamp(40px,6vw,88px)/.92 var(--display);font-stretch:114%}
  .papers-head p{margin:14px 0 0;color:var(--ink-2);max-width:48ch}
  .years{display:flex;flex-wrap:wrap;gap:6px;max-width:520px}
  .years a{padding:7px 10px;border:1px solid var(--line);border-radius:4px;text-decoration:none;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .years a:hover{color:var(--ink);border-color:var(--ink-2)}

  .list{grid-column:1;grid-row:2;display:flex;flex-direction:column}
  .year-mark{margin:48px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);scroll-margin-top:90px}
  .year-mark:first-child{margin-top:0}
  .ch{min-height:72svh;display:flex;flex-direction:column;justify-content:center;padding-block:44px;opacity:.26;transition:opacity .35s}
  .ch.on{opacity:1}
  .ch .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--tag)}
  .ch .meta .lead{color:var(--ink)}
  .ch h3{margin:12px 0 0;font:800 clamp(24px,2.7vw,38px)/1.06 var(--display);font-stretch:104%;text-wrap:balance}
  .ch .award{margin-top:12px;color:var(--gold)}
  .ch .award::before{content:"★ "}
  .ch p.sum{margin:14px 0 0;color:var(--ink);max-width:46ch;font-size:18px}
  .ch p.auth{margin:12px 0 0;color:var(--mute);font-size:14px;line-height:1.5;max-width:52ch}
  .ch p.auth b{color:var(--ink-2);font-weight:600}
  .ch .plinks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px}
  .ch .plinks a{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-underline-offset:5px;color:var(--ink)}
  .ch .inline-media{display:none}

  .screen{grid-column:2;grid-row:2;align-self:start;position:sticky;top:calc(10svh + 30px);height:min(74svh,640px);border-radius:6px;overflow:hidden;background:var(--ground-2)}
  .screen .m{position:absolute;inset:0;opacity:0;transition:opacity .35s ease}
  .screen .m.on{opacity:1}
  .screen video{width:100%;height:100%;object-fit:cover}
  .screen .fig{background:var(--paper);display:flex;align-items:center;justify-content:center;padding:6%}
  .screen .fig img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:50% 50%;will-change:transform}
  .screen .type{background:radial-gradient(120% 90% at 20% 110%,#1d2530 0%,var(--ground-2) 60%);display:flex;flex-direction:column;justify-content:flex-end;padding:8%}
  .screen .type .big{font:900 clamp(64px,10vw,150px)/.8 var(--display);font-stretch:125%;color:var(--ink);letter-spacing:-.02em}
  .screen .type .ven{margin-top:14px;color:var(--tag)}
  .screen .type .strip{height:6px;margin-top:22px;background:var(--hmap);transform-origin:left}
  .hud{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 12px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:end;
    background:linear-gradient(0deg,rgba(0,0,0,.6),rgba(0,0,0,0));color:var(--on-media);pointer-events:none}
  .hud .bar{grid-column:1/-1;height:3px;background:rgba(var(--i-rgb),.18);border-radius:2px;overflow:hidden}
  .hud .fill{height:100%;background:var(--hmap);transform-origin:left;transform:scaleX(0)}
  .hud span{font-variant-numeric:tabular-nums;text-shadow:0 1px 8px rgba(0,0,0,.8)}

  @media (max-width:860px){
    .papers{display:block}
    .screen{top:calc(56px + env(safe-area-inset-top,0px));height:38svh;z-index:2;margin-bottom:8px}
    .ch{min-height:66svh;justify-content:flex-start;padding-block:28px}
    .ch h3{font-size:clamp(22px,6vw,30px)}
    .ch p.sum{font-size:17px}
  }

  /* ---------- news + footer ---------- */
  .news{padding-inline:var(--gutter);padding-block:40px 80px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:32px;border-top:1px solid var(--line);margin-top:40px}
  .news h2{margin:0;font:800 32px/1 var(--display);font-stretch:112%}
  .news ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .news li{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
  .news time{color:var(--mute);font-variant-numeric:tabular-nums}
  @media (max-width:760px){.news{grid-template-columns:1fr}.news li{grid-template-columns:1fr;gap:4px}}
  footer{padding-inline:var(--gutter);padding-block:32px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;color:var(--mute);border-top:1px solid var(--line)}
  footer a{color:var(--ink-2)}

  @media (prefers-reduced-motion:reduce){
    .rec{animation:none}
    .ch,.screen .m{transition:none}
  }

  /* ---------- selected papers: link out to the full list ---------- */
  .more-row{grid-column:1/-1;grid-row:3;display:flex;justify-content:flex-start;padding-top:48px}
  .nav ul a[aria-current="page"]{color:var(--ink)}

  /* ---------- all papers: cards ---------- */
  .pubs{padding-inline:var(--gutter);padding-block:120px 60px}
  .pubs-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:24px 40px}
  .pubs-head h1{margin:0;font:800 clamp(44px,7vw,104px)/.9 var(--display);font-stretch:114%}
  .pubs-head p{margin:14px 0 0;color:var(--ink-2);max-width:52ch}
  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:36px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .chip{appearance:none;border:1px solid var(--line);background:none;color:var(--ink-2);border-radius:999px;padding:9px 14px;cursor:pointer;font-variant-numeric:tabular-nums}
  .chip:hover{color:var(--ink);border-color:var(--ink-2)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .search{margin-left:auto;flex:1 1 220px;max-width:340px;background:var(--ground-2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:10px 12px;font:400 15px/1.2 var(--body)}
  .search::placeholder{color:var(--mute)}
  .empty{color:var(--ink-2);padding:40px 0}
  .yr{display:grid;grid-template-columns:120px minmax(0,1fr);gap:24px;padding-top:36px}
  .yr > h2{margin:0;font:800 34px/1 var(--display);font-stretch:112%;color:var(--ink-2);position:sticky;top:84px;align-self:start;font-variant-numeric:tabular-nums}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:30px 22px}
  .card{display:flex;flex-direction:column}
  .thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:5px;overflow:hidden;background:var(--ground-2);cursor:pointer}
  .thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .thumb video{opacity:0;transition:opacity .25s}
  .thumb.playing video{opacity:1}
  .thumb.fig{background:var(--paper);cursor:default}
  .thumb.fig img{object-fit:contain;padding:6%}
  .thumb.type{cursor:default;background:radial-gradient(120% 90% at 20% 110%,#1d2530 0%,var(--ground-2) 60%);display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
  .thumb.type .big{font:900 56px/.8 var(--display);font-stretch:125%;color:var(--ink)}
  .thumb.type .strip{height:4px;margin-top:12px;background:var(--hmap)}
  .thumb .badge{position:absolute;left:10px;bottom:9px;color:var(--on-media);text-shadow:0 1px 8px rgba(0,0,0,.85)}
  .card .meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--tag)}
  .card .meta .lead{color:var(--ink)}
  .card h3{margin:6px 0 0;font:600 18px/1.3 var(--body);text-wrap:balance}
  .card h3 a{text-decoration:none}
  .card h3 a:hover{text-decoration:underline;text-underline-offset:3px}
  .card .award{margin-top:6px;color:var(--gold)}
  .card .award::before{content:"★ "}
  .card .auth{margin:8px 0 0;color:var(--mute);font-size:14px;line-height:1.45}
  .card .auth b{color:var(--ink-2);font-weight:600}
  .card .plinks{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
  .card .plinks a{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-underline-offset:4px;color:var(--ink-2)}
  .card .plinks a:hover{color:var(--ink)}
  @media (max-width:760px){
    .yr{grid-template-columns:1fr;gap:14px}
    .yr > h2{position:static}
    .search{margin-left:0;max-width:none}
  }
  .thumb.type .ven{margin-top:8px;color:var(--tag)}

  /* ---------- shared sections ---------- */
  .section{padding-inline:var(--gutter);padding-block:96px 0}
  .section-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px 32px;margin-bottom:32px}
  .section-head .eyebrow{margin-bottom:12px}
  .section-head h2{margin:0;font:800 clamp(34px,4.6vw,64px)/.95 var(--display);font-stretch:112%;text-wrap:balance}
  .page-head{padding-inline:var(--gutter);padding-block:132px 8px}
  .page-head h1{margin:0;font:800 clamp(48px,8vw,120px)/.88 var(--display);font-stretch:116%}
  .page-head p{margin:18px 0 0;color:var(--ink-2);max-width:56ch;font-size:19px}
  .foot-links{display:flex;flex-wrap:wrap;gap:8px 18px}

  /* ---------- home: at a glance ---------- */
  .glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .glance > div{padding:26px 20px 24px 0}
  .glance > div + div{padding-left:20px;border-left:1px solid var(--line)}
  .glance b{display:block;font:800 clamp(34px,4vw,54px)/1 var(--display);font-stretch:112%;font-variant-numeric:tabular-nums}
  .glance span{display:block;margin-top:10px;color:var(--ink-2)}
  .glance small{display:block;margin-top:14px;color:var(--mute);font:400 12px/1.4 var(--mono)}
  @media (max-width:640px){.glance > div + div{padding-left:0;border-left:0;border-top:1px solid var(--line)}}

  /* ---------- home: now / feature ---------- */
  .feature{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,56px);align-items:center}
  .feature h3{margin:10px 0 0;font:800 clamp(30px,3.6vw,52px)/1 var(--display);font-stretch:110%}
  .feature p{color:var(--ink-2);max-width:48ch}
  .feature .tag{color:var(--tag)}
  @media (max-width:860px){.feature{grid-template-columns:1fr}}
  /* Gemini Robotics: official clip (credited) */
  .feature .brand-wrap{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:6px;overflow:hidden;background:var(--ground-2)}
  .feature .brand-wrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .credit{margin-top:8px;color:var(--mute);font-size:10.5px;letter-spacing:.06em}
  .feature .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 20px;margin:22px 0 24px;padding-top:16px;border-top:1px solid var(--line)}
  .feature .facts dt{color:var(--mute);font-size:11px}
  .feature .facts dd{margin:4px 0 0;color:var(--ink);font-size:15px;line-height:1.35}

  /* ---------- project cards (home) ---------- */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px 22px}
  .pcard{display:flex;flex-direction:column;text-decoration:none}
  .pcard .media{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:5px;overflow:hidden;background:var(--ground-2)}
  .pcard .media img,.pcard .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
  .pcard:hover .media img,.pcard:hover .media video{transform:scale(1.04)}
  .pcard .when{margin-top:14px;color:var(--tag)}
  .pcard h3{margin:6px 0 0;font:800 24px/1.1 var(--display);font-stretch:108%}
  .pcard p{margin:8px 0 0;color:var(--ink-2)}

  /* ---------- projects page ---------- */
  .proj{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,56px);padding-inline:var(--gutter);padding-block:72px;border-top:1px solid var(--line);scroll-margin-top:60px}
  .proj.flip .pm{order:2}
  .proj .pm{display:flex;flex-direction:column;gap:14px}
  .proj .pm .box{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:6px;overflow:hidden;background:var(--ground-2)}
  .proj .pm .box video,.proj .pm .box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .proj .pm .box.paper{background:var(--paper)}
  .proj .pm .box.paper img{object-fit:contain;padding:4%}
  .proj .pm .still{aspect-ratio:16/10;max-width:100%;border-radius:6px;overflow:hidden;background:var(--paper)}
  .proj .pm .still img{width:100%;height:100%;object-fit:contain}
  .proj .when{color:var(--tag)}
  .proj h2{margin:10px 0 0;font:800 clamp(32px,4vw,56px)/.98 var(--display);font-stretch:110%;text-wrap:balance}
  .proj .tagline{margin:14px 0 0;font-size:20px;line-height:1.35;color:var(--ink)}
  .proj .body p{color:var(--ink-2);max-width:52ch}
  .proj dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:20px 0 0;padding-top:16px;border-top:1px solid var(--line)}
  .proj dt{color:var(--mute)}
  .proj dd{margin:0;font:500 13px/1.5 var(--mono);overflow-wrap:anywhere}
  .proj .plinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  .rel{grid-column:1/-1;margin-top:8px}
  .rel h3{margin:0 0 14px;color:var(--mute)}
  .rel-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px}
  .rel-row a{display:flex;flex-direction:column;gap:8px;text-decoration:none}
  .rel-row .t{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:4px;overflow:hidden;background:var(--ground-2)}
  .rel-row .t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .rel-row .t.fig{background:var(--paper)}
  .rel-row .t.fig img{object-fit:contain;padding:5%}
  .rel-row .t.type{display:flex;align-items:flex-end;padding:10px;font:900 30px/.8 var(--display);font-stretch:125%;background:radial-gradient(120% 90% at 20% 110%,#1d2530 0%,var(--ground-2) 60%)}
  .rel-row span{font:600 14px/1.3 var(--body)}
  .rel-row small{color:var(--tag);font:400 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
  .proj-index{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
  @media (max-width:860px){.proj{grid-template-columns:1fr}.proj.flip .pm{order:0}}

  /* ---------- CV ---------- */

 "RA-L", "url": "https://arxiv.org/abs/2408.16567", "xpl": "/explainers/terrain-physical-parameters/"}, "llmctf": {"title": "Dataset and Lessons Learned from the 2024 SaTML LLM Capture-the-Flag Competition", "year": 2024, "venue": "NeurIPS", "url": "https://arxiv.org/abs/2406.07954", "xpl": "/explainers/llm-ctf/"}, "adv": {"title": "Rethinking Robustness Assessment: Adversarial Attacks on Learning-based Quadrupedal Locomotion Controllers", "year": 2024, "venue": "RSS", "url": "https://arxiv.org/abs/2405.12424", "xpl": "/explainers/adversarial-locomotion/"}, "wheeled": {"title": "Learning robust autonomous navigation and locomotion for wheeled-legged robots", "year": 2024, "venue": "Science Robotics", "url": "https://www.science.org/doi/full/10.1126/scirobotics.adi9641", "xpl": "/explainers/wheeled-legged-navigation/"}, "confined": {"title": "Learning to walk in confined spaces using 3D representation", "year": 2024, "venue": "ICRA", "url": "https://arxiv.org/abs/2403.00187", "xpl": "/explainers/confined-spaces/"}, "risk": {"title": "Learning risk-aware quadrupedal locomotion using distributional reinforcement learning", "year": 2024, "venue": "ICRA", "url": "https://arxiv.org/abs/2309.14246", "xpl": "/explainers/risk-aware-locomotion/"}, "riskaverse": {"title": "Learning a Risk-Averse Locomotion Policy from Uncertainty Estimates", "year": 2024, "venue": "CoRL Workshop", "url": "https://mediatum.ub.tum.de/doc/1764922/document.pdf", "xpl": "/explainers/risk-averse-locomotion/"}, "mem": {"title": "MEM: Multi-Modal Elevation Mapping for Robotics and Learning", "year": 2023, "venue": "IROS", "url": "https://arxiv.org/abs/2309.16818", "xpl": "/explainers/multi-modal-elevation-mapping/"}, "planetary": {"title": "Scientific exploration of challenging planetary analog environments with a team of legged robots", "year": 2023, "venue": "Science Robotics", "url": "https://arxiv.org/abs/2307.10079", "xpl": "/explainers/planetary-analog/"}, "catch": {"title": "Event-based Agile Object Catching with a Quadrupedal Robot", "year": 2023, "venue": "ICRA", "url": "https://arxiv.org/abs/2303.17479", "xpl": "/explainers/event-based-catching/"}, "gpu": {"title": "Elevation mapping for locomotion and navigation using GPU", "year": 2022, "venue": "IROS", "url": "https://arxiv.org/abs/2204.12876", "xpl": "/explainers/gpu-elevation-mapping/"}, "cerbwin": {"title": "Team CERBERUS wins the DARPA Subterranean Challenge: Technical overview and lessons learned", "year": 2022, "venue": "Field Robotics", "url": "https://arxiv.org/abs/2207.04914", "xpl": "/explainers/cerberus-subt-overview/"}, "cerbsr": {"title": "CERBERUS in the DARPA Subterranean Challenge", "year": 2022, "venue": "Science Robotics", "url": "https://www.science.org/doi/full/10.1126/scirobotics.abp9742", "xpl": "/explainers/cerberus-science-robotics/"}, "perceptive": {"title": "Learning robust perceptive locomotion for quadrupedal robots in the wild", "year": 2022, "venue": "Science Robotics", "url": "https://www.science.org/doi/10.1126/scirobotics.abk2822", "xpl": "/explainers/perceptive-locomotion/"}, "wbc": {"title": "Combining learning-based locomotion policy with model-based manipulation for legged mobile manipulators", "year": 2022, "venue": "RA-L", "url": "https://arxiv.org/abs/2201.03871", "xpl": "/explainers/locomotion-manipulation/"}, "cerbfr": {"title": "CERBERUS: Autonomous legged and aerial robotic exploration in the tunnel and urban circuits of the DARPA Subterranean Challenge", "year": 2022, "venue": "Field Robotics", "url": "https://arxiv.org/abs/2201.07067", "xpl": "/explainers/cerberus-tunnel-urban/"}, "occl": {"title": "Reconstructing occluded elevation information in terrain maps with self-supervised learning", "year": 2022, "venue": "RA-L", "url": "https://arxiv.org/abs/2109.07150", "xpl": "/explainers/occluded-elevation/"}, "nav": {"title": "Real-time optimal navigation planning using learned motion costs", "year": 2021, "venue": "ICRA", "url": "https://ieeexplore.ieee.org/abstract/document/9561861", "xpl": "/explainers/learned-motion-costs/"}, "occlws": {"title": "Solving Occlusion in Terrain Mapping with Neural Networks", "year": 2021, "venue": "Robot Learning Workshop", "url": "https://www.research-collection.ethz.ch/entities/publication/4dded43e-a0f1-4dec-8c82-2cb440b3c60c", "xpl": "/explainers/occluded-elevation/"}, "circus": {"title": "Circus ANYmal: A quadruped learning dexterous manipulation with its limbs", "year": 2021, "venue": "ICRA", "url": "https://arxiv.org/abs/2011.08811", "xpl": "/explainers/circus-anymal/"}, "foothold": {"title": "Perceptive locomotion in rough terrain: online foothold optimization", "year": 2020, "venue": "RA-L", "url": "https://ieeexplore.ieee.org/abstract/document/9134750", "xpl": "/explainers/foothold-optimization/"}, "store": {"title": "A mobile dual-arm manipulation robot system for stocking and disposing of items in a convenience store by using universal vacuum grippers for grasping items", "year": 2020, "venue": "Advanced Robotics", "url": "papers.html#store", "xpl": ""}, "uavugv": {"title": "UAV/UGV autonomous cooperation: UAV assists UGV to climb a cliff by attaching a tether", "year": 2019, "venue": "ICRA", "url": "https://arxiv.org/abs/1903.04898", "xpl": "/explainers/uav-ugv-tether/"}, "lunar": {"title": "Finding the North on a Lunar Microrover: a Lunar Surface Environment Simulator for the Development of Vision-Based Navigation Pipelines", "year": 2018, "venue": "IAC", "url": "papers.html#lunar", "xpl": ""}, "search": {"title": "Multi-agent Time-based Decision-making for the Search and Action Problem", "year": 2018, "venue": "ICRA", "url": "https://arxiv.org/abs/1802.10147", "xpl": "/explainers/search-and-action/"}, "rough": {"title": "Robust rough-terrain locomotion with a quadrupedal robot", "year": 2018, "venue": "ICRA", "url": "https://ieeexplore.ieee.org/abstract/document/8460731", "xpl": "/explainers/rough-terrain-locomotion-2018/"}, "armarker": {"title": "Self-localization with active attachment of AR markers by an autonomous UAV (能動的マーカ貼付により自己位置推定を行う自律飛行ロボット)", "year": 2015, "venue": "JSAI", "url": "https://youtu.be/x26QVM_Ey7U", "xpl": "/explainers/ar-marker-uav/"}}, "regions": [{"id": "mountain", "name": "Mountain", "spots": ["perc-hike", "perc-terrain", "thesis-hike", "thesis-seealpsee", "perc-slippery", "perc-steps"]}, {"id": "coast", "name": "Coast", "spots": ["early-cliff", "early-lunar", "early-search", "early-armarker", "early-store"]}, {"id": "town", "name": "Town", "spots": ["perc-confined", "elev-nav", "elev-map", "field-city"]}, {"id": "under", "name": "Underground", "spots": ["subt-urban", "subt-tunnel", "subt-cave"]}, {"id": "volcano", "name": "Volcano", "spots": ["field-planetary", "field-etna"]}, {"id": "campus", "name": "Campus", "spots": ["thesis-hongg", "safe-attack", "safe-risk", "safe-prefs", "llm-ctf"]}, {"id": "park", "name": "Park", "spots": ["manip-wbc", "manip-circus", "motion-parkour", "manip-catch", "motion-priors"]}, {"id": "home", "name": "Home", "spots": ["manip-door", "safe-quiet", "gr2-home"]}], "spots": {"early-cliff": {"name": "Drone + rover teamwork", "note": "UTokyo · ICRA 2019", "text": "A drone carries a tether up the cliff and wraps it around a pole at the top. The tracked rover tied to the other end then winches itself up a slope it could never climb alone.", "see": "The drone circles the pole to wrap the tether, lands, and the tracked rover winches itself up the rock step.", "media": "scrub/uavugv.mp4", "papers": ["uavugv"], "project": "early"}, "early-armarker": {"name": "A drone that marks its own map", "note": "UTokyo · 2015", "text": "My first project: a small drone that sticks its own AR markers onto the ceiling as it goes, then uses them to work out where it is in places nobody prepared for it.", "see": "The AR.Drone rising to press a new marker onto the boathouse ceiling; the chain of markers grows behind it.", "media": "scrub/armarker.mp4", "papers": ["armarker"], "project": "early"}, "early-search": {"name": "Search and action with a drone team", "note": "ETH ASL · ICRA 2018", "text": "For the MBZIRC challenge, a team of drones must find objects and bring them to a drop box before time runs out. Each drone decides on its own when to keep searching and when to cash in, treating the remaining time as a budget. (Simulation study.)", "see": "Three drones over a probability map: tall warm bars are where a target is likely; the bars sink where a drone has looked. One drone ferries a disc to the box as the clock runs down.", "media": "scrub/search.mp4", "papers": ["search"], "project": "early"}, "early-lunar": {"name": "A lunar microrover", "note": "ispace · 2017–2018", "text": "At ispace I worked on a small lunar exploration rover: ToF camera processing, elevation mapping, and a simulator of the lunar surface for developing vision-based navigation.", "see": "The SORATO-class microrover on a grey test pit in the dunes, sweeping its cameras; the sun and the rocks’ shadows give it a compass heading.", "media": "", "papers": ["lunar"], "project": "early"}, "early-store": {"name": "A convenience-store robot", "note": "Hitachi R&D · WRS 2018, 3rd prize", "text": "At Hitachi: a mobile robot with two arms and vacuum grippers that restocks shelves and removes items in a convenience store.", "see": "The two-armed robot binning an expired sandwich and handing an onigiri from one arm to the other before placing it on the shelf.", "media": "", "papers": ["store"], "project": "early"}, "perc-hike": {"name": "A full hike, start to summit", "note": "Science Robotics 2022", "text": "The perceptive locomotion controller took ANYmal on a complete hiking trail up Mount Etzel near Zurich: 2.2 km with 120 m of climbing. It reached the summit in 31 minutes, faster than the 35 minutes the signpost gives for people.", "see": "ANYmal and a hiker on the switchback trail, from the signpost at the bottom to the flag on the summit.", "media": "clips/v_hike.mp4", "papers": ["perceptive"], "project": "perceptive"}, "perc-terrain": {"name": "Snow, streams, stairs and rubble", "note": "Science Robotics 2022", "text": "The same policy walks over terrain that fools cameras: deep snow, tall vegetation, wet roots, loose rubble and stairs. It learned in simulation to trust vision when it is reliable and its legs when it isn’t, then went straight onto the real robot.", "see": "ANYmal wading through deep snow while its height map (blue) wrongly floats above the surface: the policy stops trusting vision there, then trusts it again on the stone stairs.", "media": "scrub/perceptive.mp4", "papers": ["perceptive", "thesis"], "project": "perceptive"}, "perc-steps": {"name": "Stepping stones and obstacles", "note": "RA-L 2020 · ICRA 2018", "text": "Before learning took over, I worked on model-based perceptive locomotion: online elevation mapping plus foothold optimization let the (black) ANYmal pick safe footholds over steps, gaps and loose bricks, all computed on board.", "see": "ANYmal B at the trailhead timber yard: up a pallet ramp and over loose bricks. The green discs are the footholds it picks next.", "media": "scrub/foothold.mp4", "papers": ["foothold", "rough"], "project": "perceptive"}, "perc-slippery": {"name": "Seeing slippery and soft ground", "note": "RA-L 2024", "text": "Not every hazard shows up as geometry. The robot learns to predict friction and stiffness from camera images, trained on what its feet actually felt, so it knows a surface is slippery or soft before stepping onto it.", "see": "ANYmal D at the lakeshore: one foot slips on the wet board, its disc turns pale (low friction), and the prediction then paints the rest of the board pale before the other feet arrive.", "media": "scrub/terrain.mp4", "papers": ["terrain"], "project": "perceptive"}, "perc-confined": {"name": "Squeezing through collapsed spaces", "note": "ICRA 2024 · Best Paper, Service Robotics", "text": "With a 3D voxel view instead of a 2.5D height map, the robot can crouch under overhangs and squeeze through gaps in collapsed buildings. A high-level policy plans full-body motion for a robust low-level walker.", "see": "ANYmal crouching under a tilted concrete slab, wrapped in the voxels it perceives, then standing up again on the far side.", "media": "scrub/confined.mp4", "papers": ["confined"], "project": "perceptive"}, "elev-map": {"name": "elevation_mapping_cupy", "note": "Open source · IROS 2022 · IROS 2023", "text": "My open-source GPU elevation mapping turns depth and LiDAR points into a robot-centric height map in milliseconds, with layers for traversability, smoothing, inpainting and plane segmentation. MEM later extended it to colors and semantics.", "see": "ANYmal walking down the town stairway while its height map grows around it; the colours cycle through the raw, traversability, inpainting and plane-segmentation layers.", "media": "img/projects/elevation_repo.jpg", "papers": ["gpu", "mem"], "project": "elevation"}, "elev-nav": {"name": "Filling gaps and planning paths", "note": "RA-L 2022 · ICRA 2021", "text": "Maps have holes behind rocks and slopes, so a self-supervised network learns to fill them in. On top of the map, a planner uses motion costs learned from how the robot actually moves to pick paths in real time.", "see": "Holes behind the rocks fill in (pink), a fan of candidate paths is scored by learned cost, and the robot walks the winner.", "media": "fig/occl.jpg", "papers": ["occl", "occlws", "nav"], "project": "elevation"}, "subt-cave": {"name": "Underground: DARPA SubT Final", "note": "1st place · Team CERBERUS · 2021", "text": "Team CERBERUS sent legged and flying robots into an unknown underground course of tunnels, caves and a subway station. With no GPS and barely any communication, they explored, mapped and searched on their own, and won the $2,000,000 first prize.", "see": "In the cave: the Explorer ANYmal climbs a rubble mound in its own headlight, its LiDAR painting the walls, while a Carrier ANYmal drops a communication relay.", "media": "scrub/cerbsr.mp4", "papers": ["cerbsr"], "project": "subt"}, "subt-urban": {"name": "Underground: the subway station", "note": "DARPA SubT Final 2021 · 1st place", "text": "The Final course combined a tunnel, a cave and an urban subway station. Four ANYmals, helped by a rover and guided by one operator outside, explored for an hour, found 23 of the hidden objects and won. Carrier robots laid communication relays as they went, so the others could keep talking to the base.", "see": "On the subway platform the Carrier ANYmal lowers its hind end and drops a relay, then walks on along the platform.", "media": "scrub/cerbwin.mp4", "papers": ["cerbwin"], "project": "subt"}, "field-etna": {"name": "Gas monitoring on Mount Etna", "note": "IEEE RAM 2026", "text": "ANYmal carried a mass spectrometer across Etna’s loose volcanic slopes and measured volcanic gases autonomously, following planned missions between sampling points on terrain where wheeled robots get stuck.", "see": "The robot with its caged mass spectrometer on the crater rim, passing a test gas bottle; its path turns into dots coloured by the gas it measured.", "media": "scrub/etna.mp4", "papers": ["etna"], "project": "field"}, "field-planetary": {"name": "A robot team on planetary analog terrain", "note": "Science Robotics 2023", "text": "Three legged robots with different science instruments explored Moon- and Mars-like terrain as a team, climbing loose slopes that current planetary rovers avoid.", "see": "Scout, Hybrid and Scientist at the lander: the Scientist presses its microscope onto a boulder while the others scan and climb.", "media": "scrub/planetary.mp4", "papers": ["planetary"], "project": "field"}, "field-city": {"name": "Wheeled-legged robots in the city", "note": "Science Robotics 2024", "text": "An ANYmal with wheels on its feet navigates town on its own: rolling fast along streets, stepping up curbs and stairs, and moving around people.", "see": "The wheeled ANYmal rolling down the street, weaving around a pedestrian and stepping up the curb one wheel at a time.", "media": "scrub/wheeled.mp4", "papers": ["wheeled"], "project": "field"}, "safe-attack": {"name": "Attacking a policy to make it safer", "note": "RSS 2024", "text": "A learned attacker searches for small, realistic errors, a slightly wrong sense of tilt or speed command, that make a walking controller fall. Those failures show exactly where the policy is fragile, and training against them makes it sturdier.", "see": "In the classroom: the board sketches attacker → fake 3° tilt → fall. In front, the red ghost shows the tilt the attacker makes the robot believe; the old policy falls, the retrained one keeps its feet.", "media": "scrub/adv.mp4", "papers": ["adv"], "project": "robust"}, "safe-risk": {"name": "Knowing when to be careful", "note": "ICRA 2024 · CoRL 2024 workshop", "text": "Instead of predicting a single expected outcome, the robot learns the spread of possible outcomes and how uncertain it is. A risk setting then chooses between cautious and bold behavior near hazards.", "see": "The board shows the spread of possible outcomes and the risk dial. In front, the same robot approaches a timber step: cautious, it backs off; bold, it climbs.", "media": "fig/risk.jpg", "papers": ["risk", "riskaverse"], "project": "robust"}, "safe-prefs": {"name": "Learning from human preferences", "note": "IEEE RAM 2026", "text": "Instead of hand-writing rewards, a person picks which of two robot behaviors they prefer. DAPPER asks about pairs that are easy to tell apart, so far fewer questions are needed.", "see": "Two gaits side by side and a student at a laptop ticking the better one; the chosen gait moves toward the target crawl.", "media": "fig/dapper.jpg", "papers": ["dapper"], "project": "robust"}, "safe-quiet": {"name": "Quiet steps at home", "note": "ICRA 2025", "text": "For a home robot, being safe also means being pleasant to live with. The small aibo robot dog learns to soften its footsteps so it walks quietly indoors.", "see": "aibo tiptoeing across the living room. The soft rings are its quiet footsteps; the red ghost rings show how loud the old walk was.", "media": "scrub/quiet.mp4", "papers": ["quiet"], "project": "robust"}, "motion-parkour": {"name": "Humanoid parkour", "note": "RA-L 2026 · Unitree G1", "text": "A diffusion model generates human-like, terrain-aware motions in real time, and a learned tracker follows them. The Unitree G1 humanoid climbs onto boxes, vaults hurdles and takes stairs using only onboard perception.", "see": "The humanoid planting its hands and a knee on the pallet stack, mantling up, then jumping down onto the mat.", "media": "clips/h_box_climbing_01.mp4", "papers": ["humanoid"], "project": "motion"}, "motion-priors": {"name": "Animal-like motion on rough ground", "note": "CoRL 2025", "text": "ANYmal first learns natural gaits by imitating recorded animal motion on flat ground. A higher-level policy then adapts that style to obstacles and rough terrain.", "see": "ANYmal walking the garden with a dog-like gait, guided by the translucent reference dog, to the blue goal pin.", "media": "scrub/priors.mp4", "papers": ["priors"], "project": "motion"}, "manip-door": {"name": "Opening doors", "note": "CoRL 2024", "text": "One learned controller lets ANYmal with an arm open a door and walk through, working out by feel whether it must push or pull.", "see": "At the house door: the hook presses the lever, a tug does nothing, so the robot pushes and holds the door open with its arm while it walks through.", "media": "scrub/doors.mp4", "papers": ["doors"], "project": "manipulation"}, "manip-wbc": {"name": "Keeping an arm steady", "note": "RA-L 2022", "text": "The walking policy is told in advance how the arm is about to push on the body, so the arm controller can hold its gripper steady even when the base is pushed.", "see": "Someone shoves ALMA in the workshop yard; the body sways but the gripper stays on the blue dot.", "media": "scrub/wbc.mp4", "papers": ["wbc"], "project": "manipulation"}, "manip-circus": {"name": "Circus ANYmal", "note": "ICRA 2021", "text": "Lying on its back, ANYmal turns a large ball with its legs on command. It was trained in simulation and needs no contact sensors.", "see": "ANYmal on its back in the circus tent, turning the pink yoga ball with its feet.", "media": "scrub/circus.mp4", "papers": ["circus"], "project": "manipulation"}, "manip-catch": {"name": "Catching with an event camera", "note": "ICRA 2023", "text": "An event camera reports changes with very low latency, so ANYmal sees a thrown ball early enough to catch it in a net.", "see": "A ball thrown on the sports field, the event camera’s red and blue trail, and ANYmal lunging to catch it in the net on its back.", "media": "scrub/catch.mp4", "papers": ["catch"], "project": "manipulation"}, "gr2-home": {"name": "Gemini Robotics 2, at home", "note": "Google DeepMind · 2025–now", "text": "At Google DeepMind I work on Gemini Robotics: vision-language-action models that understand a task, reason about it and act. Gemini Robotics 2 controls whole humanoids from feet to fingertips, and the same model also runs two-armed robots.", "see": "In the kitchen, an Apollo humanoid puts a mug from the floor into the basket and a two-arm station folds a towel, both driven by the same model.", "media": "", "papers": [], "project": "gr2"}, "llm-ctf": {"name": "LLM capture-the-flag", "note": "SaTML 2024 · NeurIPS 2024", "text": "At IEEE SaTML 2024, teams hid a secret in a language model’s system prompt and then attacked each other’s defenses. Our team, RSLLM, placed 2nd; the dataset and lessons were published at NeurIPS 2024.", "see": "In the classroom: chat messages bounce off three filter gates around the vault; one persistent attacker leaks the secret letter by letter.", "media": "scrub/llmctf.mp4", "papers": ["llmctf"], "project": "llm"}, "thesis-hike": {"project": "perceptive", "name": "Zermatt: 10 km down on its own", "note": "PhD thesis · ETH Zurich 2025", "media": "fig/thesis.jpg", "papers": ["thesis"], "text": "The final chapter of my PhD thesis: ANYmal descended 10.1 km from Gornergrat to Furi above Zermatt, 1,220 m down, largely on its own. A vision-language model (GPT-4V) labels what it sees (gravel path, grass, water) with a risk, a steppable flag and a preferred flag about every 10 seconds; a segmentation network paints those values into the elevation map six times a second, and learned navigation and walking policies follow the map. A sign detector makes it stop and ask when it sees a sign. People stepped in only twice, both times at construction sites.", "see": "By the Riffelsee, with the Matterhorn behind. Around the robot is its elevation map with the language model’s labels painted in: the preferred gravel path is a blue corridor, while grass, water and rocks are red and drawn raised, the way the navigation policy sees them. At the road-work sign it stops and asks the model; the closed path turns red, the grass turns blue, and it detours until the END sign."}, "thesis-seealpsee": {"project": "perceptive", "name": "Seealpsee: a lakeside hike past cows", "note": "PhD thesis · Seealpsee, Appenzell", "media": "fig/thesis_seealpsee.jpg", "papers": ["thesis"], "text": "A 2.38 km loop around Seealpsee in the Appenzell Alps, on gravel paths shared with hikers and grazing cows. The same system of GPS route, vision-language common sense and learned navigation and walking policies kept the robot on the path and a respectful distance from the animals.", "see": "ANYmal on the lakeshore path; cows stand on the gravel ahead, and the robot swings wide around them before rejoining the path."}, "thesis-hongg": {"project": "perceptive", "name": "ETH Hönggerberg: common sense on campus", "note": "PhD thesis · ETH Zurich campus", "media": "fig/thesis_hongg.jpg", "papers": ["thesis"], "text": "On a 1.2 km course around the ETH Hönggerberg campus, ROAM was compared with a geometry-only planner and a goal-image navigator. Only ROAM handled all three challenges on its own: it stayed on the path where the global route cut through bushes, labelled a mannequin lying on the path as \"human\" and walked around it, and read the road-work signs. With a \"WARNING: Exploding Cans\" sign it placed its feet between the cans.", "see": "The robot comes up the campus path, the model labels the mannequin as a human (risk 1.0, red and raised on the map), and it walks around on the grass; beyond it, the cans behind their warning sign."}, "subt-tunnel": {"project": "subt", "name": "Underground: the mine tunnel", "note": "Field Robotics 2022 · Tunnel & Urban circuits", "media": "fig/cerbfr.jpg", "papers": ["cerbfr"], "text": "Before the Final, CERBERUS competed in the Tunnel circuit, in a real mine, and the Urban circuit, in an unfinished power plant. The black ANYmal B robots and drones explored, mapped and searched long mine drifts with rails and timber supports, with almost no communication back to the operator.", "see": "A mine drift with timber sets and rails: the black ANYmal B explores in its headlight while a drone flies ahead, and an artifact (a fire extinguisher) is boxed as a detection."}}}</script>

  // the shadow box follows whatever the camera looks at, so nearby robots get crisp shadows
